<!doctype html>
<html>
<head><title>Login — Medical Strongroom</title>  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Staff Login</h1>
  {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input type="text" name="username" required></label><br>
    <label>Password <input type="password" name="password" required></label><br>
    <button type="submit">Log in</button>
  </form>
  <p><a href="{{ url_for('register_page') }}">Need an account? Register</a></p>
  <p class="recovery-link"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
</body>
</html>
