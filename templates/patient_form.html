<!doctype html>
<html>
<head><title>{{ "Edit" if patient else "Add" }} Patient — Medical Strongroom</title>  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>{{ "Edit" if patient else "Add" }} Patient</h1>
  {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if not patient %}
    <label>MRN <input type="text" name="mrn" required></label><br>
    {% endif %}
    <label>Full name <input type="text" name="full_name" value="{{ patient['full_name'] if patient else '' }}" required></label><br>
    <label>Date of birth <input type="date" name="dob" value="{{ patient['dob'] if patient else '' }}" required></label><br>
    <label>Contact info <input type="text" name="contact_info" value="{{ patient['contact_info'] if patient else '' }}"></label><br>
    <button type="submit">Save</button>
  </form>
  <p><a href="{{ url_for('patients_list') }}">Back to patients</a></p>
</body>
</html>
